
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quét mã sản phẩm</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #183153;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 20px auto;
      padding: 22px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 4px 20px #00000012;
    }

    h2 {
      color: #0875bd;
      margin-top: 0;
    }

    p { color: #64748b; }

    #reader {
      width: 100%;
      min-height: 220px;
      margin: 18px auto;
      overflow: hidden;
      border-radius: 12px;
      background: #111;
    }

    /* Giữ hình camera hiển thị đúng kích thước */
    #reader video {
      display: block !important;
      width: 100% !important;
      max-width: 100% !important;
      height: auto !important;
      object-fit: contain !important;
    }

    #reader img {
      max-width: 100%;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #startBtn {
      background: #0875bd;
      color: white;
    }

    #closeBtn {
      background: #e5e7eb;
      color: #183153;
    }

    #status {
      font-weight: bold;
    }

    #result {
      padding: 12px;
      background: #e8f5e9;
      border-radius: 10px;
      overflow-wrap: anywhere;
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>QUÉT MÃ SẢN PHẨM</h2>

    <p>Đưa mã QR hoặc mã vạch vào giữa khung camera.</p>

    <div id="reader"></div>

    <p id="status">Sẵn sàng mở camera</p>

    <div id="result"></div>

    <button id="startBtn" onclick="startScan()">
      MỞ CAMERA
    </button>

    <button id="closeBtn" onclick="closePage()">
      ĐÓNG TRANG QUÉT
    </button>
  </div>

  <script>
    let scanner = null;
    let busy = false;
    let starting = false;

    const readerId = 'reader';

    // Cấu hình khung quét tự điều chỉnh theo màn hình
    const scanConfig = {
      fps: 15,

      qrbox: function(width, height) {
        return {
          width: Math.max(1, Math.floor(Math.min(300, width * 0.85))),
          height: Math.max(1, Math.floor(Math.min(180, height * 0.45)))
        };
      },

      disableFlip: false
    };

    // Tạo scanner mới
    function createScanner() {
      scanner = new Html5Qrcode(readerId);
      return scanner;
    }

    // Xóa scanner cũ
    async function resetScanner() {
      if (scanner) {
        try {
          if (scanner.isScanning) {
            await scanner.stop();
          }
        } catch (e) {}

        try {
          scanner.clear();
        } catch (e) {}

        scanner = null;
      }
    }

    // Khi quét thành công
    async function onScanSuccess(decodedText) {
      if (busy) return;

      busy = true;

      const code = String(decodedText).trim();

      document.getElementById('status').textContent =
        'Đã quét thành công!';

      document.getElementById('result').style.display = 'block';

      document.getElementById('result').textContent =
        'Mã sản phẩm: ' + code;

      try {
        if (scanner && scanner.isScanning) {
          await scanner.stop();
        }
      } catch (e) {}

      if (window.opener && !window.opener.closed) {

        window.opener.postMessage({
          type: 'PRODUCT_SCANNED',
          code: code
        }, '*');

        document.getElementById('status').textContent =
          'Đã gửi mã về website tra cứu!';

        setTimeout(function() {
          window.close();
        }, 1200);

      } else {

        document.getElementById('status').textContent =
          'Không kết nối được website tra cứu. Hãy mở trang quét từ Google.';

      }
    }

    // Khởi động camera theo cách dự phòng
    async function startWithFallback() {
      createScanner();

      try {
        // Ưu tiên camera sau theo danh sách thiết bị
        let cameras = [];

        try {
          cameras = await Html5Qrcode.getCameras();
        } catch (e) {
          cameras = [];
        }

        const rearCamera = cameras.find(function(camera) {
          return /back|rear|environment|sau|world/i.test(
            camera.label || ''
          );
        });

        if (rearCamera) {
          document.getElementById('status').textContent =
            'Đang mở camera sau...';

          try {
            await scanner.start(
              rearCamera.id,
              scanConfig,
              onScanSuccess,
              function() {}
            );

            return;
          } catch (e) {
            // Nếu camera theo ID lỗi, thử cách chọn dự phòng
            await resetScanner();
            createScanner();
          }
        }

        // Dự phòng: yêu cầu trình duyệt chọn camera sau
        document.getElementById('status').textContent =
          'Đang thử kết nối camera...';

        await scanner.start(
          { facingMode: 'environment' },
          scanConfig,
          onScanSuccess,
          function() {}
        );

      } catch (error) {

        await resetScanner();

        throw error;
      }
    }

    // Mở camera
    async function startScan() {

      if (starting || (scanner && scanner.isScanning)) {
        return;
      }

      starting = true;

      busy = false;

      document.getElementById('result').style.display = 'none';

      document.getElementById('status').textContent =
        'Đang chuẩn bị camera...';

      try {

        await resetScanner();

        await startWithFallback();

        // Bổ sung thuộc tính hiển thị video cho Chrome Android
        const video = document.querySelector('#reader video');

        if (video) {
          video.setAttribute('playsinline', 'true');
          video.setAttribute('autoplay', 'true');
          video.muted = true;

          video.play().catch(function() {});
        }

        document.getElementById('status').textContent =
          'Đang quét. Hãy đưa mã vào giữa khung.';

      } catch (error) {

        document.getElementById('status').textContent =
          'Không mở được camera: ' + error;

        await resetScanner();

      } finally {

        starting = false;

      }
    }

    // Đóng trang quét
    async function closePage() {

      await resetScanner();

      window.close();
    }

    // Tự mở camera khi trang được mở
    window.addEventListener('load', function() {
      startScan();
    });

  </script>
</body>
</html>
